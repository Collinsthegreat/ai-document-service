version: '3.8'

services:
  
  postgres:
    image: postgres:15-alpine
    container_name: document-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - document-network

  
  minio:
    image: minio/minio:latest
    container_name: document-service-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - document-network

  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-service-app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/document_service
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: openai/gpt-4o-mini
      MAX_FILE_SIZE_MB: 5
      ALLOWED_EXTENSIONS: pdf,docx
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - document-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  document-network:
    driver: bridge